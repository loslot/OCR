services:
  - type: web
    name: quickocr-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: TESSERACT_LANG
        value: khm+eng
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: CORS_ORIGINS
        value: "https://ocr-g3tg.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
